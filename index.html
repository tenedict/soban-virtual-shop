<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#261b13">
  <!-- 홈 화면에 추가하면 주소창 없이 전체 화면으로 열린다(아이폰은 브라우저 전체 화면을 지원하지 않는다) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OHANAE">
  <meta name="description" content="오하나에의 실제 패브릭 상품을 두 개의 실사 공간에서 둘러보는 가상 쇼룸">
  <link rel="manifest" href="manifest.webmanifest">
  <title>OHANAE — 두 개의 방, 하나의 취향</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
  <style>
    :root {
      --paper: #fffaf0;
      --ink: #241a13;
      --muted: rgba(255, 250, 240, .7);
      --line: rgba(255, 255, 255, .24);
      --glass: rgba(34, 25, 18, .58);
      --glass-heavy: rgba(30, 22, 16, .88);
      --accent: #e5c17a;
      --accent-deep: #9e6f2d;
      --green: #8da797;
      --shadow: rgba(0, 0, 0, .28);
      --display: "Gowun Batang", "AppleMyungjo", serif;
      --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #21170f; }
    body { font-family: var(--body); color: var(--paper); }
    button { font: inherit; color: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    [hidden] { display: none !important; }

    .store {
      position: fixed;
      inset: 0;
      isolation: isolate;
      overflow: hidden;
      background: #21170f;
    }

    /* 사진은 화면을 꽉 채운다(cover). 화면 비율이 사진과 다르면(폰 세로 화면) 남는 쪽을 밀어서 둘러본다. */
    .stage {
      position: absolute;
      inset: 0;
      overflow: auto;
      overscroll-behavior: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .stage::-webkit-scrollbar { display: none; }
    .store.pannable .stage { cursor: grab; }
    .store.dragging .stage { cursor: grabbing; }

    .scene {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }
    @supports (height: 100dvh) {
      .scene { height: 100dvh; }
    }

    /* 한눈에 보기: 사진 전체를 화면 안에 넣는다 */
    .store.overview .stage { overflow: hidden; display: grid; place-items: center; }
    .store.overview .scene { width: 100%; height: 100%; }
    .store.overview .spot .tag { display: none; }

    .pan-hint {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: max(22px, calc(env(safe-area-inset-bottom) + 10px));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 16px;
      background: var(--glass);
      box-shadow: 0 12px 36px var(--shadow), inset 0 1px rgba(255, 255, 255, .12);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      backdrop-filter: blur(18px) saturate(1.15);
      font-size: 13px;
      color: rgba(255, 250, 240, .9);
      pointer-events: none;
      animation: enter-up .8s .6s both cubic-bezier(.2, .8, .2, 1);
    }
    .pan-hint b { color: var(--accent); font-weight: 400; animation: nudge 1.6s ease-in-out infinite; }
    .pan-hint b:last-child { animation-direction: reverse; }
    @keyframes nudge { 50% { transform: translateX(-4px); } }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(18, 12, 8, .5) 0%, transparent 24%, transparent 65%, rgba(16, 10, 7, .48) 100%),
        linear-gradient(90deg, rgba(15, 10, 7, .16), transparent 20%, transparent 80%, rgba(15, 10, 7, .14));
      z-index: 1;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: .08;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
    }

    .topbar {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: max(22px, env(safe-area-inset-left));
      right: max(22px, env(safe-area-inset-right));
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
      animation: enter-down .8s .15s both cubic-bezier(.2, .8, .2, 1);
    }

    .brand, .cart-button, .guide, .sound-button {
      border: 1px solid var(--line);
      background: var(--glass);
      box-shadow: 0 12px 36px var(--shadow), inset 0 1px rgba(255, 255, 255, .12);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      backdrop-filter: blur(18px) saturate(1.15);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      border-radius: 999px;
      padding: 9px 17px 10px;
      pointer-events: auto;
    }
    .brand strong { font-family: var(--display); font-size: clamp(22px, 2vw, 29px); letter-spacing: .08em; }
    .brand span { color: var(--muted); font-size: 12px; letter-spacing: .08em; }

    .actions { display: flex; gap: 10px; pointer-events: auto; }
    .cart-button, .sound-button {
      border-radius: 999px;
      min-height: 46px;
      cursor: pointer;
      transition: transform .2s, background .2s, border-color .2s;
    }
    .cart-button:hover, .sound-button:hover { transform: translateY(-2px); background: rgba(37, 27, 19, .76); border-color: rgba(255, 255, 255, .42); }
    .cart-button { display: flex; align-items: center; gap: 9px; padding: 7px 8px 7px 17px; }
    .cart-button svg { width: 18px; height: 18px; }
    .cart-count {
      min-width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }
    .cart-count.bump { animation: bump .4s ease; }
    .sound-button { width: 46px; display: grid; place-items: center; padding: 0; }
    .sound-button svg { width: 18px; height: 18px; }
    .sound-button[aria-pressed="true"] { background: rgba(255, 250, 240, .94); color: var(--ink); }

    .bottom-ui {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100% - 36px);
      animation: enter-up .8s .45s both cubic-bezier(.2, .8, .2, 1);
    }
    .room {
      opacity: 0;
      pointer-events: none;
      transform: scale(.96);
      transform-origin: center;
      filter: blur(8px);
      transition: opacity .65s ease, transform .85s cubic-bezier(.2, .8, .2, 1), filter .65s ease;
    }
    .room.active { opacity: 1; pointer-events: auto; transform: scale(1); filter: none; }
    .room.outgoing { opacity: 0; transform: scale(1.09); filter: blur(8px); }
    .room-transition {
      position: absolute;
      inset: -10%;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at center, rgba(255, 246, 224, .34), rgba(30, 20, 13, .46) 72%);
      -webkit-backdrop-filter: blur(0);
      backdrop-filter: blur(0);
    }
    .store.moving .room-transition { animation: room-rush .75s ease both; }
    .guide {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 13px;
      color: rgba(255, 250, 240, .88);
    }
    .guide i { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 6px rgba(229, 193, 122, .14); }
    .room-nav {
      display: flex;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass);
      box-shadow: 0 12px 36px var(--shadow), inset 0 1px rgba(255, 255, 255, .12);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      backdrop-filter: blur(18px) saturate(1.15);
    }
    .room-nav button {
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      padding: 7px 13px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: color .2s, background .2s;
    }
    .room-nav button[aria-pressed="true"] { background: rgba(255, 250, 240, .94); color: var(--ink); font-weight: 600; }

    .floor-portals {
      position: absolute;
      z-index: 10;
      left: max(34px, 5vw, env(safe-area-inset-left));
      bottom: clamp(108px, 15vh, 168px);
      perspective: 700px;
      animation: floor-enter .9s .5s both cubic-bezier(.2, .8, .2, 1);
    }
    .floor-portal {
      position: relative;
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 250px;
      border: 1px solid rgba(255, 250, 235, .3);
      border-radius: 20px;
      padding: 11px 18px 12px 12px;
      overflow: hidden;
      background: linear-gradient(100deg, rgba(28, 20, 14, .58), rgba(45, 32, 22, .18));
      box-shadow: 0 18px 42px rgba(0, 0, 0, .2), inset 0 1px rgba(255, 255, 255, .13);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);
      backdrop-filter: blur(12px) saturate(1.1);
      cursor: pointer;
      text-align: left;
      transform: rotate(-4deg) rotateX(9deg);
      transform-origin: left bottom;
      transition: transform .25s ease, border-color .25s, background .25s;
    }
    .floor-portal::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.15) 46%, transparent 68%);
      transform: translateX(-110%);
      animation: portal-shine 4.6s 1.2s infinite;
      pointer-events: none;
    }
    .floor-portal:hover, .floor-portal:focus-visible {
      transform: rotate(-2deg) rotateX(4deg) translate(-8px, -4px);
      border-color: rgba(255, 250, 235, .62);
      background: linear-gradient(100deg, rgba(28, 20, 14, .72), rgba(45, 32, 22, .28));
    }
    .portal-arrow {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      flex: none;
      border: 1px solid rgba(255, 250, 235, .4);
      border-radius: 16px;
      background: rgba(255, 250, 235, .1);
      color: var(--accent);
      font-size: 34px;
      line-height: 1;
      text-shadow: 0 2px 12px rgba(0,0,0,.28);
      transition: transform .25s;
    }
    .floor-portal:hover .portal-arrow { transform: translateX(-5px); }
    .portal-copy { display: grid; gap: 2px; }
    .portal-copy small { color: rgba(255, 250, 240, .62); font-size: 10px; font-weight: 600; letter-spacing: .14em; }
    .portal-copy strong { font-family: var(--display); font-size: 17px; font-weight: 700; letter-spacing: .01em; }

    .spot { cursor: pointer; outline: none; }
    .spot .area { fill: transparent; stroke: transparent; stroke-width: 3; transition: fill .25s, stroke .25s; }
    .spot .pulse { fill: rgba(255, 245, 220, .26); transform-box: fill-box; transform-origin: center; animation: pulse 2.4s infinite; }
    .spot .core { fill: rgba(255, 250, 238, .94); stroke: rgba(93, 62, 29, .92); stroke-width: 3; filter: drop-shadow(0 3px 8px rgba(0, 0, 0, .35)); transition: transform .22s; transform-box: fill-box; transform-origin: center; }
    .spot .tag { opacity: 0; transform: translateY(5px); transition: opacity .2s, transform .2s; pointer-events: none; }
    .spot .tag rect { fill: rgba(28, 20, 14, .9); stroke: rgba(255, 255, 255, .18); stroke-width: 1; }
    .spot .tag text { fill: var(--paper); font-family: var(--body); font-weight: 600; font-size: 18px; letter-spacing: .02em; }
    .spot:hover .area, .spot:focus-visible .area { fill: rgba(255, 244, 216, .08); stroke: rgba(255, 246, 226, .75); }
    .spot:hover .tag, .spot:focus-visible .tag { opacity: 1; transform: none; }
    .spot:hover .core, .spot:focus-visible .core { transform: scale(1.18); }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(12, 8, 5, .42);
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s;
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }
    .scrim.open { opacity: 1; pointer-events: auto; }

    .panel {
      position: fixed;
      z-index: 21;
      top: 14px;
      right: 14px;
      bottom: 14px;
      width: min(458px, calc(100% - 28px));
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 24px;
      overflow: hidden;
      background: var(--glass-heavy);
      box-shadow: -18px 20px 70px rgba(0, 0, 0, .42);
      -webkit-backdrop-filter: blur(28px) saturate(1.15);
      backdrop-filter: blur(28px) saturate(1.15);
      transform: translateX(calc(100% + 34px));
      transition: transform .42s cubic-bezier(.2, .8, .2, 1);
      padding-top: env(safe-area-inset-top);
    }
    .panel.open { transform: none; }
    .panel-head { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 27px 26px 20px; border-bottom: 1px solid rgba(255, 255, 255, .12); }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .panel h2 { font-family: var(--display); margin: 0; font-size: 32px; letter-spacing: .02em; }
    .panel-desc { margin: 7px 0 0; color: rgba(255, 250, 240, .62); font-size: 13px; line-height: 1.55; }
    .close {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 50%;
      background: rgba(255, 255, 255, .08);
      cursor: pointer;
      font-size: 23px;
      line-height: 1;
    }
    .panel-body { flex: 1; overflow-y: auto; padding: 8px 26px 22px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }

    .product { display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; align-items: center; padding: 18px 0; border-bottom: 1px solid rgba(255, 255, 255, .11); }
    .product-mark { width: 72px; height: 72px; display: grid; place-items: center; overflow: hidden; border-radius: 16px; background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.05)); color: var(--accent); font-family: var(--display); font-size: 23px; }
    .product-mark img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .product h3 { margin: 0 0 3px; font-size: 14px; font-weight: 600; }
    .product p { margin: 0; color: rgba(255, 250, 240, .54); font-size: 12px; }
    .product-side { text-align: right; }
    .price { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .add {
      border: 1px solid rgba(229, 193, 122, .65);
      border-radius: 999px;
      background: transparent;
      color: var(--accent);
      padding: 5px 11px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    .add:hover { background: var(--accent); color: var(--ink); }
    .official-link { display: inline-block; margin-top: 7px; color: rgba(255, 250, 240, .65); font-size: 10px; text-decoration: none; }
    .official-link:hover { color: var(--paper); text-decoration: underline; }

    .cart-line { display: grid; grid-template-columns: 1fr auto; gap: 15px; align-items: center; padding: 18px 0; border-bottom: 1px solid rgba(255, 255, 255, .11); }
    .cart-line h3 { margin: 0 0 4px; font-size: 14px; }
    .cart-line p { margin: 0; color: rgba(255, 250, 240, .55); font-size: 12px; }
    .stepper { display: flex; align-items: center; border: 1px solid rgba(255, 255, 255, .18); border-radius: 999px; overflow: hidden; }
    .stepper button { width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer; }
    .stepper span { min-width: 22px; text-align: center; font-size: 12px; }
    .empty { padding: 70px 10px; text-align: center; color: rgba(255, 250, 240, .58); font-size: 13px; }
    .empty strong { display: block; margin-bottom: 7px; color: var(--paper); font-family: var(--display); font-size: 22px; }
    .panel-foot { padding: 18px 26px calc(22px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255, 255, 255, .12); }
    .summary { display: flex; justify-content: space-between; margin-bottom: 13px; font-size: 16px; font-weight: 600; }
    .checkout { width: 100%; border: 0; border-radius: 14px; background: var(--accent); color: var(--ink); padding: 14px; cursor: pointer; font-weight: 700; }
    .prototype-note { margin: 10px 0 0; color: rgba(255, 250, 240, .5); font-size: 11px; text-align: center; }

    .toast {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 130%);
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(28, 20, 14, .9);
      box-shadow: 0 12px 35px var(--shadow);
      padding: 10px 17px;
      font-size: 13px;
      transition: transform .32s cubic-bezier(.2, .8, .2, 1);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }
    .toast.show { transform: translate(-50%, 0); }

    @keyframes pulse { 0%, 100% { transform: scale(.8); opacity: .75; } 70% { transform: scale(2.15); opacity: 0; } }
    @keyframes bump { 50% { transform: scale(1.22); } }
    @keyframes enter-down { from { opacity: 0; transform: translateY(-15px); } }
    @keyframes enter-up { from { opacity: 0; transform: translate(-50%, 15px); } }
    @keyframes room-rush {
      0% { opacity: 0; transform: scale(1); -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0); }
      42% { opacity: .9; transform: scale(1.05); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
      100% { opacity: 0; transform: scale(1.12); -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0); }
    }
    @keyframes floor-enter { from { opacity: 0; transform: translate(-18px, 15px); } }
    @keyframes portal-shine { 0%, 72% { transform: translateX(-110%); } 88%, 100% { transform: translateX(110%); } }

    @media (max-width: 680px) {
      .topbar { top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; }
      .brand { padding: 7px 12px 8px; }
      .brand strong { font-size: 22px; }
      .brand span, .cart-button > span:first-of-type { display: none; }
      .actions { gap: 8px; }
      .sound-button { width: 42px; min-height: 42px; }
      .cart-button { padding-left: 11px; min-height: 42px; }
      .cart-count { height: 26px; min-width: 26px; }
      .guide { font-size: 12px; padding: 9px 13px; }
      .bottom-ui { width: calc(100% - 24px); justify-content: center; flex-wrap: wrap; }
      .room-nav button { padding: 6px 10px; }
      .floor-portals { left: 18px; bottom: max(92px, 13vh); }
      .floor-portal { min-width: 220px; padding: 9px 14px 10px 10px; border-radius: 18px; }
      .portal-arrow { width: 46px; height: 46px; font-size: 29px; }
      .portal-copy strong { font-size: 15px; }
      .panel { inset: auto 8px max(8px, env(safe-area-inset-bottom)); width: auto; max-height: min(80vh, 720px); max-height: min(80dvh, 720px); border-radius: 22px; transform: translateY(calc(100% + 20px)); padding-top: 0; }
      .panel-head { padding: 22px 20px 17px; }
      .panel-body { padding: 5px 20px 18px; }
      .panel-foot { padding: 16px 20px calc(18px + env(safe-area-inset-bottom)); }
      .panel h2 { font-size: 28px; }
      .product { grid-template-columns: 58px 1fr auto; gap: 11px; }
      .product-mark { width: 58px; height: 58px; }
      .tag { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="store" id="store">
    <svg class="scene" id="scene" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice" role="img" aria-label="오하나에의 두 개 전시 공간">
      <g class="room active" data-room="table" aria-hidden="false">
        <image href="ohanae-room-a.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>

        <g class="spot" tabindex="0" role="button" data-cat="white_table" aria-label="화이트 레이스 패브릭 상품 보기">
          <polygon class="area" points="342,528 818,528 824,883 352,883"/>
          <circle class="pulse" cx="620" cy="650" r="14"/><circle class="core" cx="620" cy="650" r="9"/>
          <g class="tag"><rect x="536" y="594" width="168" height="36" rx="18"/><text x="620" y="618" text-anchor="middle">화이트 레이스</text></g>
        </g>

        <g class="spot" tabindex="0" role="button" data-cat="brown_table" aria-label="브라운 테이블 매트 상품 보기">
          <polygon class="area" points="760,500 1166,500 1178,668 760,668"/>
          <circle class="pulse" cx="985" cy="560" r="14"/><circle class="core" cx="985" cy="560" r="9"/>
          <g class="tag"><rect x="899" y="504" width="172" height="36" rx="18"/><text x="985" y="528" text-anchor="middle">브라운 테이블 매트</text></g>
        </g>

        <g class="spot" tabindex="0" role="button" data-cat="purple_table" aria-label="퍼플 레이스 매트 상품 보기">
          <polygon class="area" points="822,590 1422,590 1422,842 842,842"/>
          <circle class="pulse" cx="1170" cy="700" r="14"/><circle class="core" cx="1170" cy="700" r="9"/>
          <g class="tag"><rect x="1090" y="644" width="160" height="36" rx="18"/><text x="1170" y="668" text-anchor="middle">퍼플 레이스 매트</text></g>
        </g>

        <g class="spot" tabindex="0" role="button" data-cat="gift" aria-label="오하나에 선물 포장 보기">
          <polygon class="area" points="1095,302 1418,302 1418,548 1095,548"/>
          <circle class="pulse" cx="1260" cy="408" r="14"/><circle class="core" cx="1260" cy="408" r="9"/>
          <g class="tag"><rect x="1200" y="352" width="120" height="36" rx="18"/><text x="1260" y="376" text-anchor="middle">선물 포장</text></g>
        </g>
      </g>

      <g class="room" data-room="accessory" aria-hidden="true">
        <image href="ohanae-room-b.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>

        <g class="spot" tabindex="-1" role="button" data-cat="hanging" aria-label="숄더백과 행잉 패브릭 상품 보기">
          <polygon class="area" points="54,116 675,116 675,512 54,512"/>
          <circle class="pulse" cx="420" cy="285" r="14"/><circle class="core" cx="420" cy="285" r="9"/>
          <g class="tag"><rect x="338" y="229" width="164" height="36" rx="18"/><text x="420" y="253" text-anchor="middle">숄더백 · 티슈 케이스</text></g>
        </g>

        <g class="spot" tabindex="-1" role="button" data-cat="pouches" aria-label="레이스 플라워 파우치 상품 보기">
          <polygon class="area" points="248,500 840,500 844,786 248,786"/>
          <circle class="pulse" cx="560" cy="635" r="14"/><circle class="core" cx="560" cy="635" r="9"/>
          <g class="tag"><rect x="484" y="579" width="152" height="36" rx="18"/><text x="560" y="603" text-anchor="middle">플라워 파우치</text></g>
        </g>

        <g class="spot" tabindex="-1" role="button" data-cat="book" aria-label="브라운 레이스 북커버 상품 보기">
          <polygon class="area" points="846,520 1280,520 1308,792 848,792"/>
          <circle class="pulse" cx="1090" cy="650" r="14"/><circle class="core" cx="1090" cy="650" r="9"/>
          <g class="tag"><rect x="1008" y="594" width="164" height="36" rx="18"/><text x="1090" y="618" text-anchor="middle">레이스 북커버</text></g>
        </g>

        <g class="spot" tabindex="-1" role="button" data-cat="lantern" aria-label="화이트 레이스 랜턴 커버 상품 보기">
          <polygon class="area" points="1186,300 1455,300 1455,560 1186,560"/>
          <circle class="pulse" cx="1320" cy="420" r="14"/><circle class="core" cx="1320" cy="420" r="9"/>
          <g class="tag"><rect x="1238" y="364" width="164" height="36" rx="18"/><text x="1320" y="388" text-anchor="middle">랜턴 커버</text></g>
        </g>
      </g>
    </svg>

    <div class="room-transition" aria-hidden="true"></div>

    <div class="vignette"></div>
    <div class="grain"></div>

    <header class="topbar">
      <div class="brand" aria-label="오하나에 가상 쇼룸">
        <strong>OHANAE</strong><span id="brandSub">ROOM A · TABLE FABRIC</span>
      </div>
      <div class="actions">
        <button class="sound-button" id="fullscreenButton" aria-label="전체 화면으로 보기" title="전체 화면">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        </button>
        <button class="cart-button" id="cartButton">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20 8H7M10 20h.01M17 20h.01"/></svg>
          <span>장바구니</span><span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </header>

    <div class="floor-portals" id="guide" aria-label="다른 공간으로 이동">
      <button class="floor-portal" data-room-button="accessory" aria-pressed="false" aria-label="가방과 파우치를 전시한 룸 비로 이동">
        <span class="portal-arrow" aria-hidden="true">←</span>
        <span class="portal-copy"><small>NEXT · ROOM B</small><strong>가방 · 파우치 · 오브제</strong></span>
      </button>
      <button class="floor-portal" data-room-button="table" aria-pressed="true" aria-label="테이블 패브릭을 전시한 룸 에이로 이동" hidden>
        <span class="portal-arrow" aria-hidden="true">←</span>
        <span class="portal-copy"><small>BACK · ROOM A</small><strong>테이블 패브릭</strong></span>
      </button>
    </div>
  </main>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" inert>
    <div class="panel-head">
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h2 id="panelTitle"></h2>
        <p class="panel-desc" id="panelDesc"></p>
      </div>
      <button class="close" id="closeButton" aria-label="닫기">×</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-foot" id="panelFoot" hidden></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const CATEGORIES = {
      white_table: { title: 'White lace', place: 'ROOM A · 중앙 테이블 왼쪽', desc: '화이트 패브릭 위에 섬세한 레이스를 더한 오하나에의 테이블웨어.' },
      brown_table: { title: 'Brown table mat', place: 'ROOM A · 중앙 테이블 안쪽', desc: '케이크와 차가 있는 시간을 차분하게 감싸는 브라운 매트.' },
      purple_table: { title: 'Purple lace mat', place: 'ROOM A · 중앙 테이블 오른쪽', desc: '짙은 보라색 패브릭과 레이스가 만드는 오하나에의 대표 색감.' },
      gift: { title: 'Gift wrapping', place: 'ROOM A · 포장 카운터', desc: '오하나에의 마음을 담아 선물 포장으로 마무리해 드려요.' },
      hanging: { title: 'Bags & hanging fabric', place: 'ROOM B · 창가 행거', desc: '레이스와 깊은 보라색으로 완성한 숄더백과 행잉 티슈 케이스.' },
      pouches: { title: 'Flower pouches', place: 'ROOM B · 중앙 테이블 왼쪽', desc: '입체적인 플라워 레이스 원단으로 만든 두 가지 파우치.' },
      book: { title: 'Brown lace book cover', place: 'ROOM B · 중앙 테이블 오른쪽', desc: '브라운 원단과 레이스, 작은 버튼으로 마감한 북커버.' },
      lantern: { title: 'White lace lantern cover', place: 'ROOM B · 낮은 수납장 위', desc: '빛을 부드럽게 거르는 화이트 플라워 레이스 랜턴 커버.' }
    };

    const PRODUCTS = [
      { id: 'o14', cat: 'white_table', name: 'white lace tea coaster', spec: 'OHANAE · white lace', price: 9000, photo: 'products/white-lace-tea-coaster.webp', url: 'https://ohanae.kr/PRODUCT/?idx=14' },
      { id: 'o9', cat: 'white_table', name: 'white lace table mat', spec: 'OHANAE · white lace', price: 21000, photo: 'products/white-lace-table-mat.webp', url: 'https://ohanae.kr/PRODUCT/?idx=9' },
      { id: 'o13', cat: 'brown_table', name: 'brown table mat', spec: 'OHANAE · brown fabric', price: 21000, photo: 'products/brown-table-mat.webp', url: 'https://ohanae.kr/PRODUCT/?idx=13' },
      { id: 'o7', cat: 'purple_table', name: 'purple lace mat', spec: 'OHANAE · purple lace', price: 35000, photo: 'products/purple-lace-mat.webp', url: 'https://ohanae.kr/PRODUCT/?idx=7' },
      { id: 'o15', cat: 'gift', name: '선물 포장', spec: 'OHANAE gift wrapping', price: 1000, photo: 'products/gift-wrap.webp', url: 'https://ohanae.kr/PRODUCT/?idx=15' },
      { id: 'o11', cat: 'hanging', name: 'two tuck lace shoulder bag', spec: 'OHANAE · purple lace', price: 79000, photo: 'products/two-tuck-lace-shoulder-bag.webp', url: 'https://ohanae.kr/PRODUCT/?idx=11' },
      { id: 'o10', cat: 'hanging', name: 'hanging tissue case', spec: 'OHANAE · white lace', price: 37000, photo: 'products/hanging-tissue-case.webp', url: 'https://ohanae.kr/PRODUCT/?idx=10' },
      { id: 'o6', cat: 'pouches', name: 'purple lace flower pouch', spec: 'OHANAE · purple flower lace', price: 38000, photo: 'products/purple-lace-flower-pouch.webp', url: 'https://ohanae.kr/PRODUCT/?idx=6' },
      { id: 'o1', cat: 'pouches', name: 'bold flower pouch', spec: 'OHANAE · white flower lace', price: 36000, photo: 'products/bold-flower-pouch.webp', url: 'https://ohanae.kr/PRODUCT/?idx=1' },
      { id: 'o8', cat: 'book', name: 'brown lace book cover', spec: 'OHANAE · brown lace', price: 31000, photo: 'products/brown-lace-book-cover.webp', url: 'https://ohanae.kr/PRODUCT/?idx=8' },
      { id: 'o12', cat: 'lantern', name: 'white lace lantern cover', spec: 'OHANAE · white flower lace', price: 34000, photo: 'products/white-lace-lantern-cover.webp', url: 'https://ohanae.kr/PRODUCT/?idx=12' }
    ];

    const $ = id => document.getElementById(id);
    const won = value => value.toLocaleString('ko-KR') + '원';
    const getProduct = id => PRODUCTS.find(product => product.id === id);
    const ROOM_META = {
      table: { sub: 'ROOM A · TABLE FABRIC', toast: 'Room A로 이동했어요' },
      accessory: { sub: 'ROOM B · FABRIC & OBJECT', toast: 'Room B로 이동했어요' }
    };
    const STORAGE_KEY = 'ohanae-virtual-shop-cart';
    let cart = {};
    let opener = null;
    let toastTimer;
    let currentRoom = 'table';
    let roomMoving = false;

    try { cart = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (_) {}

    function cartAmount() {
      return Object.values(cart).reduce((sum, count) => sum + count, 0);
    }

    function updateCartCount(animate = false) {
      $('cartCount').textContent = cartAmount();
      if (animate) {
        $('cartCount').classList.remove('bump');
        void $('cartCount').offsetWidth;
        $('cartCount').classList.add('bump');
      }
    }

    function saveCart() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
      updateCartCount(true);
    }

    function showToast(message) {
      $('toast').textContent = message;
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200);
    }

    function productRows(category) {
      return PRODUCTS.filter(product => product.cat === category).map(product => `
        <article class="product">
          <div class="product-mark"><img src="${product.photo}" alt="${product.name}" loading="lazy"></div>
          <div><h3>${product.name}</h3><p>${product.spec}</p></div>
          <div class="product-side"><span class="price">${won(product.price)}</span><button class="add" data-add="${product.id}">담기</button><br><a class="official-link" href="${product.url}" target="_blank" rel="noopener">공식 상품 보기 ↗</a></div>
        </article>`).join('');
    }

    function openPanel(trigger) {
      opener = trigger || document.activeElement;
      $('panel').inert = false;
      $('panel').classList.add('open');
      $('scrim').classList.add('open');
      $('guide').hidden = true;
      setTimeout(() => $('closeButton').focus({ preventScroll: true }), 80);
    }

    function closePanel() {
      $('panel').classList.remove('open');
      $('scrim').classList.remove('open');
      $('panel').inert = true;
      $('guide').hidden = false;
      if (opener?.focus) opener.focus({ preventScroll: true });
    }

    function openCategory(category, trigger) {
      const info = CATEGORIES[category];
      $('eyebrow').textContent = info.place;
      $('panelTitle').textContent = info.title;
      $('panelDesc').textContent = info.desc;
      $('panelBody').innerHTML = productRows(category);
      $('panelFoot').hidden = true;
      openPanel(trigger);
    }

    function openCart(trigger) {
      $('eyebrow').textContent = 'CHECKOUT';
      $('panelTitle').textContent = '장바구니';
      $('panelDesc').textContent = '고른 물건을 천천히 확인해 보세요.';
      renderCart();
      openPanel(trigger);
    }

    function renderCart() {
      const ids = Object.keys(cart).filter(id => cart[id] > 0 && getProduct(id));
      if (!ids.length) {
        $('panelBody').innerHTML = '<div class="empty"><strong>아직 비어 있어요</strong>가게의 빛나는 물건을 눌러 마음에 드는 것을 담아보세요.</div>';
        $('panelFoot').hidden = true;
        return;
      }

      $('panelBody').innerHTML = ids.map(id => {
        const product = getProduct(id);
        return `<div class="cart-line"><div><h3>${product.name}</h3><p>${won(product.price)}</p></div><div class="stepper"><button data-step="${id}" data-delta="-1" aria-label="${product.name} 하나 빼기">−</button><span>${cart[id]}</span><button data-step="${id}" data-delta="1" aria-label="${product.name} 하나 더하기">+</button></div></div>`;
      }).join('');

      const total = ids.reduce((sum, id) => sum + getProduct(id).price * cart[id], 0);
      $('panelFoot').hidden = false;
      $('panelFoot').innerHTML = `<div class="summary"><span>합계</span><span>${won(total)}</span></div><button class="checkout" id="checkoutButton">오하나에 공식몰에서 주문하기</button><p class="prototype-note">공식몰에서 상품 옵션과 재고를 다시 확인해 주세요.</p>`;
    }

    function addProduct(id) {
      cart[id] = (cart[id] || 0) + 1;
      saveCart();
      showToast(`${getProduct(id).name} · 장바구니에 담았어요`);
    }

    function setQuantity(id, amount) {
      if (amount <= 0) delete cart[id]; else cart[id] = amount;
      saveCart();
      renderCart();
    }

    function changeRoom(nextRoom) {
      if (nextRoom === currentRoom || roomMoving || !ROOM_META[nextRoom]) return;
      if ($('panel').classList.contains('open')) closePanel();

      roomMoving = true;
      const current = document.querySelector(`.room[data-room="${currentRoom}"]`);
      const next = document.querySelector(`.room[data-room="${nextRoom}"]`);
      $('store').classList.add('moving');
      current.classList.add('outgoing');

      setTimeout(() => {
        current.classList.remove('active', 'outgoing');
        current.setAttribute('aria-hidden', 'true');
        current.querySelectorAll('.spot').forEach(spot => spot.setAttribute('tabindex', '-1'));
        next.classList.add('active');
        next.setAttribute('aria-hidden', 'false');
        next.querySelectorAll('.spot').forEach(spot => spot.setAttribute('tabindex', '0'));
        currentRoom = nextRoom;
        $('brandSub').textContent = ROOM_META[nextRoom].sub;
        document.querySelectorAll('[data-room-button]').forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.roomButton === nextRoom));
          button.hidden = button.dataset.roomButton === nextRoom;
        });
        showToast(ROOM_META[nextRoom].toast);
      }, 300);

      setTimeout(() => {
        $('store').classList.remove('moving');
        roomMoving = false;
      }, 820);
    }

    function activateSpot(spot) {
      if (spot.dataset.roomTarget) changeRoom(spot.dataset.roomTarget);
      else if (spot.dataset.action === 'cart') openCart(spot);
      else openCategory(spot.dataset.cat, spot);
    }

    $('scene').addEventListener('click', event => {
      const spot = event.target.closest('.spot');
      if (spot) activateSpot(spot);
    });

    $('scene').addEventListener('keydown', event => {
      const spot = event.target.closest('.spot');
      if (spot && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        activateSpot(spot);
      }
    });

    document.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.roomButton) changeRoom(button.dataset.roomButton);
      if (button.dataset.add) addProduct(button.dataset.add);
      if (button.dataset.step) setQuantity(button.dataset.step, (cart[button.dataset.step] || 0) + Number(button.dataset.delta));
      if (button.id === 'checkoutButton') window.open('https://ohanae.kr/PRODUCT', '_blank', 'noopener');
    });

    $('cartButton').addEventListener('click', event => openCart(event.currentTarget));
    $('closeButton').addEventListener('click', closePanel);
    $('scrim').addEventListener('click', closePanel);
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && $('panel').classList.contains('open')) closePanel(); });

    $('fullscreenButton').addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) { showToast('브라우저 전체 화면을 사용할 수 없어요'); }
    });

    updateCartCount();
  </script>
</body>
</html>
