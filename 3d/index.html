<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#faf8f4">
  <title>OHANAE 3D 쇼룸 (시제품)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Zen+Antique&display=swap">
  <style>
    /* 시제품: 1인칭으로 매장 두 방을 걸어 다니며 상품을 누른다.
       조작은 한 손 기준이다 — 바닥을 누르면 그 자리로 걸어가고, 끌면 둘러보고, 상품을 누르면 다가가서 연다.
       무엇을 어디에 놓는지는 layout.json 이 정하고, 관리자 페이지(admin.html)에서 고친다.
       화면 위 요소는 종이색 면 · 가는 선 · 먹색 글씨만 쓴다(반투명 · 흐림 · 알약 모양을 쓰지 않는다). */
    :root {
      --paper: #faf8f4;
      --ink: #1c1b19;
      --muted: #7a756d;
      --line: #d8d3c9;
      --soft: #efebe3;
      --display: "Gowun Batang", "AppleMyungjo", serif;
      --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #ece5d9; color: var(--ink); font-family: var(--body); }
    button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    [hidden] { display: none !important; }
    canvas { display: block; touch-action: none; }
    #view { position: fixed; inset: 0; cursor: grab; }
    #view.grabbing { cursor: grabbing; }
    #view.pointing { cursor: pointer; }

    /* 위: 가게 이름 줄 */
    .hud-top { position: fixed; z-index: 5; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--paper); border-bottom: 1px solid var(--line); padding: max(10px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 10px max(18px, env(safe-area-inset-left)); }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .logo { display: block; height: 34px; width: auto; }
    .intro-card .logo { height: 68px; margin: 0 auto 14px; }
    .shop-link { font-size: 12px; color: var(--muted); text-decoration: none; letter-spacing: .04em; white-space: nowrap; }
    .shop-link:hover { color: var(--ink); }
    .brand span { font-size: 11px; color: var(--muted); letter-spacing: .12em; white-space: nowrap; }
    .actions { display: flex; align-items: center; gap: 10px; }
    .cart-button { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 2px; font-size: 13px; }
    .cart-count { min-width: 22px; height: 22px; display: grid; place-items: center; padding: 0 6px; border-radius: 11px; background: var(--ink); color: var(--paper); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .cart-count.bump { animation: bump .4s ease; }
    @keyframes bump { 50% { transform: scale(1.2); } }
    .icon-button { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 3px; background: none; display: grid; place-items: center; padding: 0; }
    .icon-button svg { width: 18px; height: 18px; }
    .icon-button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    #soundToggle[aria-pressed="true"] { background: none; color: var(--ink); border-color: var(--line); }
    #soundToggle[aria-pressed="true"] .mute, #soundToggle[aria-pressed="false"] .wave { display: none; }
    #soundToggle[aria-pressed="false"] { color: var(--muted); }
    .draft-flag { position: fixed; z-index: 5; top: calc(max(10px, env(safe-area-inset-top)) + 56px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); border-radius: 3px; padding: 6px 12px; font-size: 12px; white-space: nowrap; }
    .draft-flag a { color: var(--paper); }

    /* 아래: 상품 둘러보기 */
    .dock { position: fixed; z-index: 5; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(360px, calc(100% - 24px)); display: grid; grid-template-columns: 46px 1fr 46px; align-items: stretch; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 6px 20px rgba(28, 27, 25, .08); }
    .dock button { border: 0; background: none; min-height: 48px; }
    .dock button:active { background: var(--soft); }
    .dock .arrow { font-size: 17px; line-height: 1; }
    .dock .label { display: grid; gap: 1px; align-content: center; padding: 4px 10px; text-align: center; min-width: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
    .dock .label b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dock .label span { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .hint { position: fixed; z-index: 5; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px); transform: translateX(-50%); background: var(--ink); color: var(--paper); border-radius: 3px; padding: 7px 12px; font-size: 12px; white-space: nowrap; pointer-events: none; transition: opacity .6s; }
    .hint.gone { opacity: 0; }
    .tip { position: fixed; z-index: 6; pointer-events: none; transform: translate(14px, 14px); background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 7px 11px; font-size: 13px; white-space: nowrap; }
    .tip b { display: block; font-weight: 600; }
    .tip span { color: var(--muted); font-size: 12px; }

    /* 조이스틱 (켰을 때만) */
    .stick { position: fixed; z-index: 5; left: max(24px, env(safe-area-inset-left)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 80px); width: 112px; height: 112px; border-radius: 50%; border: 1px solid rgba(28, 27, 25, .4); background: rgba(250, 248, 244, .55); pointer-events: none; }
    .stick i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: var(--ink); }

    /* 첫 화면 */
    .intro { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; background: rgba(236, 229, 217, .9); }
    .intro-card { max-width: 400px; width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 34px 28px 26px; text-align: center; }
    .intro-card small { color: var(--muted); font-size: 11px; letter-spacing: .18em; }
    .intro-card p { margin: 10px 0 22px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .keys { display: grid; grid-template-columns: auto 1fr; gap: 9px 14px; text-align: left; font-size: 13px; margin: 0 auto 24px; max-width: 290px; }
    .keys kbd { font-family: var(--body); font-size: 12px; border: 1px solid var(--line); border-radius: 3px; padding: 2px 7px; background: var(--soft); white-space: nowrap; justify-self: start; }
    .enter { width: 100%; border: 0; border-radius: 3px; background: var(--ink); color: var(--paper); padding: 14px; font-weight: 600; font-size: 14px; letter-spacing: .04em; }
    .enter:disabled { opacity: .45; }
    .loading { margin-top: 10px; font-size: 12px; color: var(--muted); }

    /* 상품 창 · 장바구니 */
    .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(28, 27, 25, .28); opacity: 0; pointer-events: none; transition: opacity .3s; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .panel { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(420px, 100%); display: flex; flex-direction: column; background: var(--paper); border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(28, 27, 25, .12); transform: translateX(105%); transition: transform .35s cubic-bezier(.2, .8, .2, 1); padding-top: env(safe-area-inset-top); }
    .panel.open { transform: none; }
    .panel-head { display: grid; grid-template-columns: 1fr auto; gap: 14px; padding: 22px 24px 16px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 11px; letter-spacing: .14em; }
    .panel h2 { font-family: var(--display); margin: 0; font-size: 25px; line-height: 1.25; }
    .close { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 3px; background: none; font-size: 20px; line-height: 1; }
    .panel-body { flex: 1; overflow-y: auto; padding: 18px 24px 22px; }
    .photo { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 2px; display: block; background: var(--soft); }
    .detail { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-top: 16px; }
    .detail p { margin: 0; color: var(--muted); font-size: 13px; }
    .price { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .row { display: flex; gap: 8px; margin-top: 18px; }
    .add { flex: 1; border: 1px solid var(--ink); border-radius: 3px; background: none; color: var(--ink); padding: 13px; font-weight: 600; font-size: 14px; }
    .official { flex: 1; display: grid; place-items: center; border: 1px solid var(--ink); border-radius: 3px; color: var(--ink); text-decoration: none; font-size: 13px; }
    .tour-row { display: flex; gap: 8px; margin-top: 8px; }
    .tour-row button { flex: 1; border: 1px solid var(--line); border-radius: 3px; background: none; padding: 11px; font-size: 13px; color: var(--muted); }
    .cart-line { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .cart-line img { width: 52px; height: 52px; object-fit: cover; border-radius: 2px; }
    .cart-line h3 { margin: 0 0 3px; font-size: 14px; font-weight: 600; }
    .cart-line p { margin: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 3px; }
    .stepper button { width: 36px; height: 36px; border: 0; background: none; }
    .stepper span { min-width: 20px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
    .empty { padding: 60px 10px; text-align: center; color: var(--muted); font-size: 13px; }
    .empty strong { display: block; color: var(--ink); font-family: var(--display); font-size: 20px; margin-bottom: 6px; }
    .panel-foot { padding: 16px 24px calc(20px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
    .summary { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .checkout { width: 100%; border: 0; border-radius: 3px; background: var(--ink); color: var(--paper); padding: 14px; font-weight: 600; }
    .note { margin: 10px 0 0; color: var(--muted); font-size: 11px; text-align: center; line-height: 1.5; }
    .desc-list { margin: 16px 0 0; padding: 0 0 0 18px; font-size: 13px; line-height: 1.65; color: #45423d; }
    .desc-list li { margin-bottom: 4px; }
    .story { margin: 14px 0 0; padding-left: 12px; border-left: 2px solid var(--line); font-family: var(--display); font-size: 13.5px; line-height: 1.7; color: var(--muted); }
    .ship { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
    .buy { flex: 1.3; display: grid; place-items: center; border-radius: 3px; background: var(--ink); color: var(--paper); text-decoration: none; padding: 13px; font-weight: 600; font-size: 14px; }
    .sum-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .cart-line h3 a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
    a.checkout { display: block; text-align: center; text-decoration: none; }

    .toast { position: fixed; z-index: 30; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 58px); transform: translate(-50%, -12px); opacity: 0; background: var(--ink); color: var(--paper); border-radius: 3px; padding: 9px 14px; font-size: 13px; white-space: nowrap; transition: transform .3s, opacity .3s; pointer-events: none; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    @media (max-width: 680px) {
      .brand span, .cart-button > span:first-of-type, .shop-link { display: none; }
      .logo { height: 30px; }
      .panel { top: auto; left: 0; width: 100%; max-height: 82dvh; border-left: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; box-shadow: 0 -12px 40px rgba(28, 27, 25, .14); transform: translateY(105%); padding-top: 0; }
      .photo { aspect-ratio: 1; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="view"></div>

  <header class="hud-top">
    <div class="brand"><img class="logo" src="assets/logo.png" alt="おはなえ OHANAE" width="85" height="34"><span id="roomLabel">ROOM A · TABLE FABRIC</span></div>
    <div class="actions">
      <a class="shop-link" href="https://ohanae.kr" target="_blank" rel="noopener">ohanae.kr ↗</a>
      <button class="icon-button" id="soundToggle" aria-pressed="true" aria-label="소리 켜고 끄기" title="소리">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <button class="icon-button" id="stickToggle" aria-pressed="false" aria-label="조이스틱으로 걷기" title="조이스틱으로 걷기" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="cart-button" id="cartButton" aria-label="장바구니 열기"><span>장바구니</span><span class="cart-count" id="cartCount">0</span></button>
    </div>
  </header>
  <div class="draft-flag" id="draftFlag" hidden>저장 전 미리보기예요 · <a href="admin.html">관리자 페이지로</a></div>

  <div class="hint" id="hint"></div>
  <nav class="dock" aria-label="상품 둘러보기">
    <button class="arrow" data-tour="-1" aria-label="이전 상품으로 걸어가기">←</button>
    <button class="label" data-tour="0"><b id="tourName">상품 둘러보기</b><span id="tourCount">눌러서 첫 상품으로</span></button>
    <button class="arrow" data-tour="1" aria-label="다음 상품으로 걸어가기">→</button>
  </nav>
  <div class="tip" id="tip" hidden><b id="tipName"></b><span id="tipPrice"></span></div>
  <div class="stick" id="stick" hidden><i id="stickKnob"></i></div>

  <div class="intro" id="intro">
    <div class="intro-card">
      <img class="logo" src="assets/logo.png" alt="おはなえ OHANAE" width="170" height="68">
      <small>MY SWEET CAKE HOUSE · 3D SHOWROOM</small>
      <p>두 개의 방을 직접 걸어 다니며 상품을 둘러보세요.</p>
      <div class="keys" id="keys"></div>
      <button class="enter" id="enterButton" disabled>불러오는 중…</button>
      <div class="loading" id="loading">매장을 준비하고 있어요</div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" inert>
    <div class="panel-head">
      <div><p class="eyebrow" id="eyebrow"></p><h2 id="panelTitle"></h2></div>
      <button class="close" id="closeButton" aria-label="닫기">×</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-foot" id="panelFoot" hidden></div>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { W, DEPTH, H, DOOR, FURNITURE, PLANTS, PLINTH, DECOR_BLOCKS, furnitureAt } from './space.js';
    import { loadLayout, modelUrl } from './store.js';

    const $ = id => document.getElementById(id);
    const won = v => v.toLocaleString('ko-KR') + '원';
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const rad = THREE.MathUtils.degToRad, deg = THREE.MathUtils.radToDeg;

    /* ───────── 배치 정보 ─────────
       주소에 ?draft 가 붙으면 관리자 페이지에서 고치던 초안을, 아니면 올려 둔 layout.json 을 쓴다. */
    const isDraft = new URLSearchParams(location.search).has('draft');
    let layout;
    try { layout = await loadLayout(isDraft); }
    catch (error) { $('loading').textContent = '배치 정보를 불러오지 못했어요. 새로 고쳐 보세요.'; throw error; }
    $('draftFlag').hidden = !isDraft;
    const PRODUCTS = layout.products;
    const getProduct = id => PRODUCTS.find(p => p.id === id);
    // 안내판 글씨에 쓸 글꼴을 잠깐 기다린다
    await Promise.race([Promise.all([document.fonts.load('700 40px "Gowun Batang"'), document.fonts.load('40px "Zen Antique"', 'おはなえ')]), new Promise(r => setTimeout(r, 1800))]);
    // 가게 정보: 구매는 오하나에 사이트에서 한다
    const SHOP = { url: 'https://ohanae.kr', products: 'https://ohanae.kr/PRODUCT', shipping: 3000, freeShippingOver: 80000, ...(layout.shop || {}) };
    const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const EYE = 1.6, R = 0.3;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    $('view').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#ece5d9');

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 90);
    camera.rotation.order = 'YXZ';
    camera.position.set(0, EYE, 7.2);

    // 세로로 긴 화면에서는 좌우가 너무 좁게 보이지 않게 시야를 넓힌다. zoom 은 두 손가락 · 휠 확대.
    let zoom = 1, zoomTarget = 1;
    function baseFov() {
      const aspect = innerWidth / innerHeight;
      return aspect < 1 ? Math.min(95, deg(2 * Math.atan(Math.tan(rad(27)) / aspect))) : 70;
    }
    function applyFov() {
      camera.fov = deg(2 * Math.atan(Math.tan(rad(baseFov() / 2)) / zoom));
      camera.updateProjectionMatrix();
    }
    applyFov();

    /* 캔버스로 만든 재질 — 테이블 깔개, 안내판 글씨, 물건 밑 그림자에만 쓴다 */
    function canvasTexture(w, h, draw, repeat) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      draw(c.getContext('2d'), w, h);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 8;
      if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
      return t;
    }
    const lace = color => canvasTexture(256, 256, (g, w, h) => {
      g.fillStyle = color; g.fillRect(0, 0, w, h);
      g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2;
      for (let y = 16; y < h; y += 32) for (let x = (y / 32 % 2) * 16 + 16; x < w; x += 32) {
        g.beginPath(); for (let a = 0; a < 6; a++) { const t = a / 6 * Math.PI * 2; g.moveTo(x, y); g.lineTo(x + Math.cos(t) * 9, y + Math.sin(t) * 9); } g.stroke();
        g.beginPath(); g.arc(x, y, 11, 0, Math.PI * 2); g.stroke();
      }
    }, [2, 1]);
    // bg 를 비우면 글씨만 있는 투명한 판이 된다
    function textTexture(lines, { w = 1024, h = 256, bg = null, fg = '#f6efe2', size = 92, font = '"Gowun Batang", serif' } = {}) {
      return canvasTexture(w, h, g => {
        if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
        g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';

    }
    function cancelWalk() { walk = null; marker.visible = false; invalidate(); }
    function stepWalk(dt) {
      if (!walk) return false;
      const p = camera.position, w = walk;
      if (!w.arrived) {
        let remaining = 0, px = p.x, pz = p.z;
        for (let i = w.seg; i < w.pts.length; i++) { remaining += Math.hypot(w.pts[i][0] - px, w.pts[i][1] - pz); [px, pz] = w.pts[i]; }
        w.t += dt;
        let step = Math.min(WALK_SPEED, .8 + w.t * 6, .5 + remaining * 2.4) * dt;   // 천천히 출발해서 천천히 멈춘다
        let dirX = 0, dirZ = 0;
        while (step > 0 && w.seg < w.pts.length) {
          const [tx, tz] = w.pts[w.seg], dx = tx - p.x, dz = tz - p.z, d = Math.hypot(dx, dz);
          if (d > .001) { dirX = dx / d; dirZ = dz / d; }
          if (d <= step) { p.x = tx; p.z = tz; step -= d; w.seg++; }
          else { p.x += dirX * step; p.z += dirZ * step; step = 0; }
        }
        const nearEnd = w.face && remaining < 1.0;
        if (nearEnd) yaw += turn(yaw, w.face.yaw) * Math.min(1, dt * 5);
        else if (w.follow && (dirX || dirZ)) yaw += turn(yaw, yawToward(dirX, dirZ)) * Math.min(1, dt * 4);
        if (w.face && remaining < 1.6) pitch += (w.face.pitch - pitch) * Math.min(1, dt * 3);
        if (w.seg >= w.pts.length) w.arrived = true;
      } else if (w.face && w.settle < .7 && (Math.abs(turn(yaw, w.face.yaw)) > .02 || Math.abs(w.face.pitch - pitch) > .02)) {
        // 도착한 뒤 상품 쪽으로 마저 돌아본다
        w.settle += dt;
        yaw += turn(yaw, w.face.yaw) * Math.min(1, dt * 7);
        pitch += (w.face.pitch - pitch) * Math.min(1, dt * 7);
      } else {
        const done = w.onArrive;
        cancelWalk();
        done?.();
        return false;
      }
      camera.rotation.set(pitch, yaw, 0);
      return !w.arrived;
    }

    // 상품 앞 보기 좋은 자리 — 물건이 바라보는 쪽으로 1.15m, 눈높이에서 물건 가운데를 본다
    function viewSpot(e) {
      const cx = e.root.position.x, cz = e.root.position.z;
      let x = cx + e.nx * 1.15, z = cz + e.nz * 1.15;
      if (blocked(x, z)) { const f = nearestFree(x, z); x = f.x; z = f.z; }
      const dx = cx - x, dz = cz - z;
      return { x, z, yaw: yawToward(dx, dz), pitch: clamp(Math.atan2(e.cy - EYE, Math.hypot(dx, dz)), -.6, .3) };
    }
    let tour = -1;
    function setTour(i) {
      tour = i;
      const p = getProduct(TOUR[i]);
      $('tourName').textContent = p.name;
      $('tourCount').textContent = `${i + 1} / ${TOUR.length} · ${won(p.price)}`;
    }
    function goToProduct(id) {
      const e = entryOf(id);
      if (!e) return;
      if (panelOpen()) closePanel();
      setTour(TOUR.indexOf(id));
      const s = viewSpot(e);
      if (!walkTo(s.x, s.z, { face: { yaw: s.yaw, pitch: s.pitch }, onArrive: () => openProduct(id) })) openProduct(id);
    }
    function tourStep(delta) {
      const n = TOUR.length;
      if (!n) return;
      const base = tour < 0 ? (delta > 0 ? -1 : 0) : tour;
      goToProduct(TOUR[(base + delta + n) % n]);
    }

    /* ───────── 보기 · 누르기 ───────── */
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    function hitAt(clientX, clientY) {
      ndc.set(clientX / innerWidth * 2 - 1, -(clientY / innerHeight) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      return raycaster.intersectObjects(pickables, true)[0] || null;
    }
    // 누름: 상품이면 다가가서 열고, 아니면 그 자리(가구 · 벽이면 그 앞)로 걸어간다
    function tapAt(clientX, clientY) {
      const hit = hitAt(clientX, clientY);
      if (!hit) return;
      if (hit.object.userData.id) return goToProduct(hit.object.userData.id);
      if (hit.point.y > 2.4) return;
      walkTo(hit.point.x, hit.point.z);
    }

    let hovered = null;
    function setHover(id, x, y) {
      if (hovered && hovered !== id) entries.forEach(e => { if (e.id === hovered) e.highlight?.(false); });
      hovered = id;
      if (id) {
        entries.forEach(e => { if (e.id === id) e.highlight?.(true); });
        const p = getProduct(id);
        $('tipName').textContent = p.name; $('tipPrice').textContent = `${won(p.price)} · 눌러서 다가가기`;
        $('tip').style.left = x + 'px'; $('tip').style.top = y + 'px'; $('tip').hidden = false;
      } else $('tip').hidden = true;
      $('view').classList.toggle('pointing', !!id);
      invalidate();
    }

    // 끌면 잡은 곳이 손을 따라온다(거리뷰 방식). 확대해도 같은 느낌이 되게 시야각에 맞춘다.
    function look(dx, dy) {
      const k = rad(camera.fov) / innerHeight * 1.15;
      yaw += dx * k; pitch = clamp(pitch + dy * k, -1.2, 1.2);
      camera.rotation.set(pitch, yaw, 0);
      if (walk) walk.follow = false;
      invalidate();
    }

    const el = renderer.domElement;
    // 마우스
    let dragging = false, lastX = 0, lastY = 0, moved = 0;
    el.addEventListener('mousedown', e => { if (e.button) return; dragging = true; lastX = e.clientX; lastY = e.clientY; moved = 0; $('view').classList.add('grabbing'); });
    addEventListener('mousemove', e => {
      if (dragging) {
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        moved += Math.abs(dx) + Math.abs(dy); lastX = e.clientX; lastY = e.clientY;
        if (moved >= 6) { look(dx, dy); setHover(null); hoverRing.visible = false; }
        return;
      }
      if (e.target !== el || panelOpen()) return;
      const hit = hitAt(e.clientX, e.clientY);
      setHover(hit?.object.userData.id || null, e.clientX, e.clientY);
      const onFloor = hit && !hit.object.userData.id && hit.point.y < .05 && !blocked(hit.point.x, hit.point.z);
      hoverRing.visible = !!onFloor && !walk;
      if (onFloor) hoverRing.position.set(hit.point.x, .02, hit.point.z);
      invalidate();
    });
    addEventListener('mouseup', e => {
      if (dragging && moved < 6 && e.target === el) tapAt(e.clientX, e.clientY);
      dragging = false; $('view').classList.remove('grabbing');
    });
    el.addEventListener('mouseleave', () => { setHover(null); hoverRing.visible = false; });
    el.addEventListener('wheel', e => { zoomTarget = clamp(zoomTarget * (e.deltaY < 0 ? 1.12 : .89), 1, 2.5); e.preventDefault(); }, { passive: false });

    // 터치: 한 손가락 끌기 = 둘러보기, 탭 = 걷기 · 고르기, 두 손가락 = 확대. 조이스틱은 켰을 때만.
    let stickOn = false, stickId = null, stickOrigin = null, pinch = null;
    const touches = new Map();
    el.addEventListener('touchstart', e => {
      for (const t of e.changedTouches) {
        if (stickOn && stickId === null && t.clientX < innerWidth * .5 && t.clientY > innerHeight * .5) {
          stickId = t.identifier; stickOrigin = [t.clientX, t.clientY];
          const s = $('stick'); s.style.left = (t.clientX - 58) + 'px'; s.style.top = (t.clientY - 58) + 'px'; s.style.bottom = 'auto';
          continue;
        }
        touches.set(t.identifier, { x: t.clientX, y: t.clientY, moved: 0 });
        if (touches.size === 2) {
          const [a, b] = [...touches.values()];
          pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, zoom: zoomTarget };
          a.moved = b.moved = 99;
        }
      }
      e.preventDefault();
    }, { passive: false });
    el.addEventListener('touchmove', e => {
      for (const t of e.changedTouches) {
        if (t.identifier === stickId) {
          let dx = t.clientX - stickOrigin[0], dy = t.clientY - stickOrigin[1];
          const d = Math.hypot(dx, dy), max = 46;
          if (d > max) { dx *= max / d; dy *= max / d; }
          stick.x = dx / max; stick.y = dy / max;
          $('stickKnob').style.transform = `translate(${dx}px, ${dy}px)`;
        } else if (touches.has(t.identifier)) {
          const s = touches.get(t.identifier), dx = t.clientX - s.x, dy = t.clientY - s.y;
          s.x = t.clientX; s.y = t.clientY; s.moved += Math.abs(dx) + Math.abs(dy);
          if (!pinch && s.moved >= 10) look(dx, dy);
        }
      }
      if (pinch && touches.size >= 2) {
        const [a, b] = [...touches.values()];
        zoomTarget = clamp(pinch.zoom * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, 1, 2.5);
      }
      e.preventDefault();
    }, { passive: false });
    function touchEnd(e, cancelled) {
      for (const t of e.changedTouches) {
        if (t.identifier === stickId) {
          stickId = null; stick.x = stick.y = 0; $('stickKnob').style.transform = '';
          const s = $('stick'); s.style.left = ''; s.style.top = ''; s.style.bottom = '';
        } else if (touches.has(t.identifier)) {
          const s = touches.get(t.identifier);
          touches.delete(t.identifier);
          if (touches.size < 2) pinch = null;
          if (!cancelled && s.moved < 10) tapAt(t.clientX, t.clientY);
        }
      }
    }
    el.addEventListener('touchend', e => touchEnd(e, false));
    el.addEventListener('touchcancel', e => touchEnd(e, true));

    addEventListener('keydown', e => {
      if (panelOpen()) { if (e.key === 'Escape') closePanel(); return; }
      if (e.target.closest?.('button, a')) return;
      keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    });
    addEventListener('keyup', e => { keys[e.code] = false; });
    addEventListener('blur', () => { for (const k in keys) keys[k] = false; dragging = false; });

    /* ───────── 효과음 ─────────
       소리 파일 없이 WebAudio 로 그때그때 만든다: 발소리(대리석 · 러그), 누름, 상품 창 여닫기, 담기, 방 옮기기, 옅은 공기 소리.
       브라우저 규칙상 첫 누름(쇼룸으로 들어가기) 뒤에야 소리가 난다. */
    const SOUND_KEY = 'ohanae-3d-sound';
    const sfx = (() => {
      let ctx = null, master = null, noiseBuf = null, on = true;
      try { on = localStorage.getItem(SOUND_KEY) !== '0'; } catch (_) {}
      function start() {
        if (ctx) { ctx.resume?.(); return; }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = on ? 1 : 0; master.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        // 방 안의 아주 옅은 공기 소리
        const air = ctx.createBufferSource(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
        air.buffer = noiseBuf; air.loop = true; lp.type = 'lowpass'; lp.frequency.value = 240; g.gain.value = .014;
        air.connect(lp).connect(g).connect(master); air.start();
      }
      const shape = (g, t, attack, peak, decay) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + attack + decay); };
      function tone(freq, peak, decay, { type = 'sine', delay = 0, slide = 0 } = {}) {
        if (!ctx) return;
        const t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + decay);
        shape(g, t, .004, peak, decay); o.connect(g).connect(master); o.start(t); o.stop(t + decay + .05);
      }
      function noise(peak, decay, { type = 'lowpass', freq = 800, q = .7, sweep = 0, attack = .003 } = {}) {
        if (!ctx) return;
        const t = ctx.currentTime, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
        src.buffer = noiseBuf; src.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
        if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t + attack + decay);
        shape(g, t, attack, peak, decay); src.connect(f).connect(g).connect(master);
        src.start(t, Math.random() * .9); src.stop(t + attack + decay + .05);
      }
      return {
        start,
        get on() { return on; },
        toggle() {
          on = !on;
          try { localStorage.setItem(SOUND_KEY, on ? '1' : '0'); } catch (_) {}
          if (master) master.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, .03);
          return on;
        },
        // 발소리: 대리석은 또각, 러그 위는 낮고 무르게
        step(soft) { const v = .88 + Math.random() * .26; noise(soft ? .03 : .075, soft ? .09 : .055, { freq: (soft ? 380 : 1700) * v, q: .9 }); tone((soft ? 68 : 96) * v, soft ? .045 : .07, .07, { slide: 44 }); },
        tap() { tone(1500, .025, .04, { type: 'triangle' }); },
        open() { noise(.028, .2, { type: 'bandpass', freq: 520, sweep: 1900, q: 1.2, attack: .05 }); },
        close() { noise(.02, .15, { type: 'bandpass', freq: 1600, sweep: 480, q: 1.2, attack: .02 }); },
        chime() { tone(1318.5, .06, .7); tone(1975.5, .045, .9, { delay: .09 }); tone(2637, .018, .6, { delay: .09 }); },
        door() { [880, 1174.7, 1318.5].forEach((f, i) => tone(f, .03, 1.1, { delay: i * .13 })); }
      };
    })();
    $('soundToggle').setAttribute('aria-pressed', String(sfx.on));
    $('soundToggle').onclick = () => { const on = sfx.toggle(); $('soundToggle').setAttribute('aria-pressed', String(on)); if (on) { sfx.start(); sfx.tap(); } toast(on ? '소리를 켰어요' : '소리를 껐어요'); };
    // 러그 위인지(발소리가 달라진다)
    const RUGS = FURNITURE.filter(f => f.kind === 'table' && Math.max(f.w, f.d) > 2).map(f => ({ x: f.x, z: f.z, r: Math.max(f.w, f.d) / 2 + .55 }));
    const onRug = (x, z) => RUGS.some(r => Math.hypot(x - r.x, z - r.z) < r.r);

    /* ───────── 장바구니 · 상품 창 ───────── */
    const STORAGE_KEY = 'ohanae-virtual-shop-cart';
    let cart = {};
    try { cart = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (_) {}
    const save = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cart)); } catch (_) {} updateCount(true); };
    function updateCount(bump) {
      $('cartCount').textContent = Object.entries(cart).reduce((a, [id, n]) => a + (getProduct(id) ? n : 0), 0);
      if (bump) { const c = $('cartCount'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
    }
    let toastTimer;
    function toast(msg) { $('toast').textContent = msg; $('toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200); }
    const panelOpen = () => $('panel').classList.contains('open');
    function openPanel() {
      for (const k in keys) keys[k] = false;
      stick.x = stick.y = 0;
      cancelWalk(); setHover(null); hoverRing.visible = false;
      $('panel').inert = false; $('panel').classList.add('open'); $('scrim').classList.add('open');
      sfx.open();
      setTimeout(() => $('closeButton').focus({ preventScroll: true }), 60);
    }
    function closePanel() {
      if (panelOpen()) sfx.close();
      $('panel').classList.remove('open'); $('scrim').classList.remove('open'); $('panel').inert = true;
    }
    const shippingNote = `배송비 ${won(SHOP.shipping)} · ${won(SHOP.freeShippingOver)} 이상 무료배송`;
    function openProduct(id) {
      const p = getProduct(id);
      $('eyebrow').textContent = roomName(camera.position.z);
      $('panelTitle').textContent = p.name;
      $('panelBody').innerHTML = `
        <img class="photo" src="${esc(p.photo)}" alt="${esc(p.name)}">
        <div class="detail"><div><p>${esc(p.spec || '')}</p></div><span class="price">${won(p.price)}</span></div>
        ${p.desc?.length ? `<ul class="desc-list">${p.desc.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
        ${p.story ? `<p class="story">${esc(p.story)}</p>` : ''}
        <div class="row">${p.url ? `<a class="buy" href="${esc(p.url)}" target="_blank" rel="noopener">오하나에에서 구매하기 ↗</a>` : ''}<button class="add" data-add="${esc(p.id)}">장바구니에 담기</button></div>
        <p class="ship">${shippingNote} · 결제는 오하나에 사이트에서 진행돼요</p>
        <div class="tour-row"><button data-tour="-1">← 이전 상품</button><button data-tour="1">다음 상품 →</button></div>`;
      $('panelBody').scrollTop = 0;
      $('panelFoot').hidden = true;
      openPanel();
    }
    function openCart() {
      $('eyebrow').textContent = 'CART';
      $('panelTitle').textContent = '장바구니';
      renderCart(); openPanel();
    }
    function renderCart() {
      const ids = Object.keys(cart).filter(id => cart[id] > 0 && getProduct(id));
      if (!ids.length) {
        $('panelBody').innerHTML = '<div class="empty"><strong>아직 비어 있어요</strong>매장을 걸어 다니며 마음에 드는 물건을 눌러 보세요.</div>';
        $('panelFoot').hidden = true; return;
      }
      $('panelBody').innerHTML = ids.map(id => { const p = getProduct(id); return `
        <div class="cart-line"><img src="${esc(p.photo)}" alt=""><div><h3>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)} ↗</a>` : esc(p.name)}</h3><p>${won(p.price)}</p></div>
        <div class="stepper"><button data-step="${esc(id)}" data-delta="-1" aria-label="${esc(p.name)} 하나 빼기">−</button><span>${cart[id]}</span><button data-step="${esc(id)}" data-delta="1" aria-label="${esc(p.name)} 하나 더하기">+</button></div></div>`; }).join('');
      const sub = ids.reduce((s, id) => s + getProduct(id).price * cart[id], 0);
      const ship = sub >= SHOP.freeShippingOver ? 0 : SHOP.shipping;
      $('panelFoot').hidden = false;
      $('panelFoot').innerHTML = `
        <div class="sum-row"><span>상품 금액</span><span>${won(sub)}</span></div>
        <div class="sum-row"><span>배송비</span><span>${ship ? won(ship) : '무료'}</span></div>
        <div class="summary"><span>합계</span><span>${won(sub + ship)}</span></div>
        <a class="checkout" href="${esc(SHOP.products)}" target="_blank" rel="noopener">오하나에에서 주문하기 ↗</a>
        <p class="note">장바구니는 고른 물건을 모아 보는 곳이에요. 주문과 결제는 오하나에 사이트에서 상품 이름을 눌러 진행해 주세요.</p>`;
    }
    document.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.add) { cart[b.dataset.add] = (cart[b.dataset.add] || 0) + 1; save(); sfx.chime(); toast(`${getProduct(b.dataset.add).name} · 담았어요`); }
      else if (!b.dataset.tour && b.id !== 'closeButton' && b.id !== 'cartButton' && b.id !== 'enterButton') sfx.tap();
      if (b.dataset.step) { const q = (cart[b.dataset.step] || 0) + Number(b.dataset.delta); if (q <= 0) delete cart[b.dataset.step]; else cart[b.dataset.step] = q; save(); renderCart(); }
      if (b.dataset.tour) { b.blur(); tourStep(Number(b.dataset.tour)); }
    });
    $('cartButton').onclick = openCart;
    $('closeButton').onclick = closePanel;
    $('scrim').onclick = closePanel;
    updateCount(false);

    /* ───────── 방 이름 · 안내 · 조이스틱 켜기 ───────── */
    const roomName = z => z >= 0 ? 'ROOM A · TABLE FABRIC' : 'ROOM B · FABRIC & OBJECT';
    let lastRoom = '';
    $('keys').innerHTML = isTouch
      ? '<kbd>바닥 탭</kbd><span>그 자리로 걸어가기</span><kbd>화면 끌기</kbd><span>둘러보기</span><kbd>상품 탭</kbd><span>다가가서 보기</span><kbd>두 손가락 벌리기</kbd><span>확대</span>'
      : '<kbd>바닥 클릭 · W A S D</kbd><span>걸어가기</span><kbd>마우스 끌기</kbd><span>둘러보기</span><kbd>상품 클릭</kbd><span>다가가서 보기</span><kbd>휠</kbd><span>확대</span>';
    $('hint').textContent = isTouch ? '바닥을 탭하면 그 자리로 걸어가요' : '바닥을 클릭하면 그 자리로 걸어가요';
    let hintTimer;
    function dismissHint() { clearTimeout(hintTimer); $('hint').classList.add('gone'); }

    const STICK_KEY = 'ohanae-3d-joystick';
    function setStick(on) {
      stickOn = on;
      $('stick').hidden = !on;
      $('stickToggle').setAttribute('aria-pressed', String(on));
      if (!on) { stickId = null; stick.x = stick.y = 0; }
      try { localStorage.setItem(STICK_KEY, on ? '1' : '0'); } catch (_) {}
    }
    if (isTouch) {
      $('stickToggle').hidden = false;
      let saved = '0';
      try { saved = localStorage.getItem(STICK_KEY) || '0'; } catch (_) {}
      setStick(saved === '1');
      $('stickToggle').onclick = () => { setStick(!stickOn); toast(stickOn ? '조이스틱을 켰어요 · 왼쪽 아래를 누르고 밀기' : '조이스틱을 껐어요'); };
    }

    function ready() { $('enterButton').disabled = false; $('enterButton').textContent = '쇼룸으로 들어가기'; }
    if (!pending) ready();
    setTimeout(() => { if ($('enterButton').disabled) ready(); }, 8000);
    $('enterButton').onclick = () => { $('intro').hidden = true; sfx.start(); sfx.door(); invalidate(5); hintTimer = setTimeout(dismissHint, 8000); };

    /* ───────── 그리기 ───────── */
    const clock = new THREE.Clock();
    let bobPhase = 0, bobAmp = 0, lastStep = 0, probe = { frames: 0, time: 0 };
    renderer.setAnimationLoop(() => {
      const raw = clock.getDelta(), dt = Math.min(raw, .1);
      // 느린 기기에서는 한 번만 해상도를 낮춘다(처음 45장은 쉬지 않고 그려서 잰다)
      if (probe && $('intro').hidden && raw < 1) {
        probe.frames++; probe.time += raw; invalidate();
        if (probe.frames === 45) {
          if (probe.time / 45 > .045) { renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25)); renderer.setSize(innerWidth, innerHeight); }
          probe = null;
        }
      }
      let walking = false;
      if (!panelOpen() && $('intro').hidden) {
        if (move(dt)) { cancelWalk(); dismissHint(); walking = true; }
        else walking = stepWalk(dt);
      }
      // 걸을 때의 작은 출렁임과 발소리(출렁임 반 바퀴마다 한 걸음)
      if (walking) bobPhase += dt * 9;
      bobAmp += ((walking ? 1 : 0) - bobAmp) * Math.min(1, dt * 8);
      camera.position.y = EYE + Math.sin(bobPhase) * .022 * bobAmp;
      const stepNo = Math.floor(bobPhase / Math.PI);
      if (walking && stepNo !== lastStep) { lastStep = stepNo; sfx.step(onRug(camera.position.x, camera.position.z)); }
      const zooming = Math.abs(zoom - zoomTarget) > .001;
      if (zooming) { zoom += (zoomTarget - zoom) * Math.min(1, dt * 10); applyFov(); }
      if (marker.visible) marker.scale.setScalar(1 + Math.sin(clock.elapsedTime * 6) * .08);
      let spinning = false;
      for (const e of entries) if (e.pivot) { e.pivot.rotation.y += dt * .45; spinning = true; }   // 3D 모델은 천천히 돈다
      const here = roomName(camera.position.z);
      if (here !== lastRoom) {
        if (lastRoom) { toast(here.startsWith('ROOM A') ? 'Room A로 들어왔어요' : 'Room B로 들어왔어요'); sfx.door(); }
        $('roomLabel').textContent = here; lastRoom = here;
        scene.environment = here.startsWith('ROOM A') ? envMaps.A : envMaps.B;   // 그 방의 360° 사진으로 바꾼다
        invalidate();
      }
      if (walking || zooming || spinning || marker.visible || bobAmp > .01) invalidate();
      if (framesLeft > 0) { framesLeft--; renderer.render(scene, camera); }
    });
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; applyFov(); renderer.setSize(innerWidth, innerHeight); invalidate(); });
  </script>
</body>
</html>
